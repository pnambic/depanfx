plugins {
  id 'depanfx.base'
  id 'org.openjfx.javafxplugin'
  id 'org.springframework.boot'
  id 'io.spring.dependency-management'
}

javafx {
  version = "${javafxVersion}"
  modules = [ 'javafx.graphics' ]
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-autoconfigure'
  implementation "org.slf4j:slf4j-api:${slf4jVersion}"

  implementation project(':DepanFxBase')
  implementation project(':DepanFxFileSystem')
  implementation project(':DepanFxGraph')
  implementation project(':DepanFxGraphDoc')
  implementation project(':DepanFxGraphInfo')
  implementation project(':DepanFxJava')
  implementation project(':DepanFxNodeFilters')
  implementation project(':DepanFxEdgeMatchers')
  implementation project(':DepanFxNodeList')
  implementation project(':DepanFxNodeViewData')
  implementation project(':DepanFxPersistence')
  implementation project(':DepanFxWorkspace')
}

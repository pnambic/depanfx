plugins {
  id 'depanfx.base'
  id 'org.openjfx.javafxplugin'
  id 'org.springframework.boot'
  id 'io.spring.dependency-management'
}

javafx {
  version = "${javafxVersion}"
  modules = [ 'javafx.controls', 'javafx.fxml' ]
}

dependencies {
  implementation "net.rgielen:javafx-weaver-core:${javafxWeaverVersion}"
  implementation "org.apache.commons:commons-csv:${apacheCsv}"
  implementation 'org.springframework.boot:spring-boot-autoconfigure'

  implementation "com.pnambic.modxstream:modxstream:${modxstreamVersion}"

  implementation project(':DepanFxBase')
  implementation project(':DepanFxGraph')
  implementation project(':DepanFxGraphDoc')
  implementation project(':DepanFxGraphInfo')
  implementation project(':DepanFxEdgeMatchers')
  implementation project(':DepanFxEdgeMatchersGui')
  implementation project(':DepanFxNodeFilters')
  implementation project(':DepanFxNodeFiltersGui')
  implementation project(':DepanFxNodeList')
  implementation project(':DepanFxPersistence')
  implementation project(':DepanFxPerspective')
  implementation project(':DepanFxScene')
  implementation project(':DepanFxWorkspace')
}
